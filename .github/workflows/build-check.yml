name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Guard against empty or broken archive
        run: |
          test -f src/main.tsx
          count=$(find content/archive -name '*.json' | wc -l)
          echo "archive entries: $count"
          test "$count" -ge 150
          pages=$(find dist/archive -name index.html | wc -l)
          echo "generated pages: $pages"
          test "$pages" -eq "$count"
          ! grep -rq '"kind": "Broadcast"' content/archive/

      - name: Validate generated archive data
        run: |
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/archive-data.json", "utf8"));
            if (data.entries.length < 150) throw new Error(`only ${data.entries.length} entries generated`);
            for (const key of ["researchSnapshot", "scopeNote", "recoveryLeadCount"]) {
              if (data.metadata[key] === undefined) throw new Error(`metadata.${key} missing from generated data`);
            }
            if (!Array.isArray(data.recoveryLeads) || !Array.isArray(data.sourceHubs)) {
              throw new Error("research arrays missing from generated data");
            }
            console.log(`generated data ok: ${data.entries.length} entries, ${data.recoveryLeads.length} recovery leads`);
          '

      - name: Verify preserved broadcast archive integrity
        run: |
          node -e '
            const fs = require("node:fs");
            const archive = JSON.parse(
              fs.readFileSync("content/private/broadcast-archive.json", "utf8"),
            );
            if (!Array.isArray(archive.entries)) {
              throw new Error("broadcast-archive.json has no entries array.");
            }
            if (archive.entries.length < 475) {
              throw new Error(
                `Expected at least 475 preserved broadcast records, found ${archive.entries.length}.`,
              );
            }
            console.log(`broadcast records: ${archive.entries.length}`);
          '
